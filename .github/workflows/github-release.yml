name: Create GitHub Release

# Creates a GitHub Release when a release tag (X.Y.Z) is pushed.
# Uses the `create` event; `create` has no tag filter, so the job guards on
# ref_type == tag and a plain X.Y.Z tag name.
on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create a GitHub release for (e.g. 6.12.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    # Only for tag creation of a plain semver tag, or a manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.ref_type == 'tag' &&
       startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Only proceed for a plain X.Y.Z release tag; skip any other tag.
          if echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$TAG' is not a plain X.Y.Z release tag; skipping."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release (idempotent)
        if: steps.tag.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; nothing to do."
            exit 0
          fi
          echo "Creating GitHub release $TAG with auto-generated notes."
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --verify-tag

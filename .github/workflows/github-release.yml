name: Create GitHub Release

# Creates a GitHub Release when a release tag (X.Y.Z) is pushed.
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create a GitHub release for (e.g. 6.12.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; nothing to do."
            exit 0
          fi
          echo "Creating GitHub release $TAG with auto-generated notes."
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
